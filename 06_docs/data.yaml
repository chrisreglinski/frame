  # match_team_fatigue — schedule density on the team's full fixture calendar.
  # Fixtures are described on two orthogonal axes, each of which partitions the calendar,
  # so either family sums to the {side}_games_* total.
  #   venue  — where the fixture was played: home / domestic (away in the team's own
  #            country, or a neutral venue inside it) / abroad (a trip out of the country).
  #   stream — which competition: league / europe (champions, europa and conference league
  #            including qualifying) / other (domestic cups, domestic and uefa super cups,
  #            fifa club competitions).
  # Roughly nine in ten `abroad` fixtures are european away legs; the rest are super cups
  # and fifa competitions, so the column reads as "played a serious match out of the country".
  # The full venue x stream grid is not carried here — several of its cells hold a few dozen
  # rows — but the calendar written alongside the table keeps it in a `cell` column.

  "{side}_hours_since_{n}_match":
    table: match_team_fatigue
    description: "hours between the kick-off of this match and the kick-off of the fixture {n} in the {side} team's calendar, counting fixtures in any competition. kick-offs are normalised to central european time before subtracting (football-data league times are uk, fbref times are venue-local with cet in brackets). capped at the 95th percentile of its own distribution over the group (thresholds.json hours_since_{n}_match_cap): past that the gap is a winter/international break or a postponement and the number stops describing recovery. each depth is capped separately, so this is not the sum of the shorter gaps. NaN if the team has fewer earlier fixtures in the season than {n} requires"
    dims:
      side: [hmt, awt]
      n: [last, 2nd_last, 3rd_last]
    dtype: float

  # cat2q splits at the median, cat3q at the tertiles. The suffix follows the elo and
  # season-stat categories, with q rather than m because the two-way split here is a
  # quantile, not the mean. Thresholds come from the pooled hmt + awt values over all
  # seasons — boundaries only, the same global convention as {side}_elo_cat3q — and the
  # p95 cap sits above the p67 boundary, so the capped tail lands wholly in `high`.
  "{side}_hours_since_{n}_match_cat2q":
    table: match_team_fatigue
    description: "half of the pooled {side}_hours_since_{n}_match distribution the value falls in (thresholds.json hours_since_{n}_match_p50); low is the shorter gap. None where the gap is NaN"
    dims:
      side: [hmt, awt]
      n: [last, 2nd_last, 3rd_last]
    dtype: string
    categories: [low, high]

  "{side}_hours_since_{n}_match_cat3q":
    table: match_team_fatigue
    description: "tertile of the pooled {side}_hours_since_{n}_match distribution (thresholds.json hours_since_{n}_match_p33/p67); low is the shortest gap. None where the gap is NaN"
    dims:
      side: [hmt, awt]
      n: [last, 2nd_last, 3rd_last]
    dtype: string
    categories: [low, medium, high]


  "{side}_games_in_{x}d":
    table: match_team_fatigue
    description: "number of fixtures in any competition played by the {side} team in the {x} days before this match's kick-off"
    dims:
      side: [hmt, awt]
      x: [8, 15, 45]
    dtype: int

  "{side}_{venue}_games_in_{x}d":
    table: match_team_fatigue
    description: "number of fixtures played {venue} by the {side} team in the {x} days before this match's kick-off. the three venues sum to {side}_games_in_{x}d"
    dims:
      side: [hmt, awt]
      venue: [home, domestic, abroad]
      x: [8, 15, 45]
    dtype: int

  "{side}_{stream}_games_in_{x}d":
    table: match_team_fatigue
    description: "number of {stream} fixtures played by the {side} team in the {x} days before this match's kick-off. the three streams sum to {side}_games_in_{x}d"
    dims:
      side: [hmt, awt]
      stream: [league, europe, other]
      x: [8, 15, 45]
    dtype: int

  "{side}_games_load_{tau}d":
    table: match_team_fatigue
    description: "decayed fixture load for the {side} team: sum over all earlier fixtures of the season of exp(-age_in_days / {tau}), age measured from this match's kick-off. a fixture played {tau} days ago contributes 1/e, one played 2*{tau} days ago 1/e^2. unlike the {x}d windows it has no cut-off, so no fixture is dropped and none counts in full"
    dims:
      side: [hmt, awt]
      tau: [7, 14]
    dtype: float

  "{side}_{venue}_games_load_{tau}d":
    table: match_team_fatigue
    description: "decayed load over fixtures played {venue} only, same kernel as {side}_games_load_{tau}d. the three venues sum to it"
    dims:
      side: [hmt, awt]
      venue: [home, domestic, abroad]
      tau: [7, 14]
    dtype: float

  "{side}_{stream}_games_load_{tau}d":
    table: match_team_fatigue
    description: "decayed load over {stream} fixtures only, same kernel as {side}_games_load_{tau}d. the three streams sum to it"
    dims:
      side: [hmt, awt]
      stream: [league, europe, other]
      tau: [7, 14]
    dtype: float

  "{side}_games_load_gauss_{tau}d":
    table: match_team_fatigue
    description: "decayed fixture load for the {side} team under a gaussian kernel: sum over all earlier fixtures of the season of exp(-(age_in_days / {tau})^2). compared with {side}_games_load_{tau}d the weight is flat for the first days and the tail dies far faster — a fixture {tau} days old still contributes 1/e, one 2*{tau} days old only 1/e^4"
    dims:
      side: [hmt, awt]
      tau: [4, 7]
    dtype: float

  "{side}_{venue}_games_load_gauss_{tau}d":
    table: match_team_fatigue
    description: "gaussian-kernel load over fixtures played {venue} only, same kernel as {side}_games_load_gauss_{tau}d. the three venues sum to it"
    dims:
      side: [hmt, awt]
      venue: [home, domestic, abroad]
      tau: [4, 7]
    dtype: float

  "{side}_{stream}_games_load_gauss_{tau}d":
    table: match_team_fatigue
    description: "gaussian-kernel load over {stream} fixtures only, same kernel as {side}_games_load_gauss_{tau}d. the three streams sum to it"
    dims:
      side: [hmt, awt]
      stream: [league, europe, other]
      tau: [4, 7]
    dtype: float

  "{side}_last_match_is_away":
    table: match_team_fatigue
    description: "the {side} team's previous fixture in any competition was played away; false at a neutral venue. NaN if the team has no earlier fixture in the season"
    dims:
      side: [hmt, awt]
    dtype: bool

  "{side}_last_match_is_abroad":
    table: match_team_fatigue
    description: "the {side} team's previous fixture in any competition was played out of the country — a european away leg, or a super cup or fifa competition staged abroad. NaN if the team has no earlier fixture in the season"
    dims:
      side: [hmt, awt]
    dtype: bool

  "{side}_last_match_is_europe":
    table: match_team_fatigue
    description: "the {side} team's previous fixture in any competition was a champions / europa / conference league match, including qualifying. NaN if the team has no earlier fixture in the season"
    dims:
      side: [hmt, awt]
    dtype: bool


target_columns:

  t_home_goals:
    table: match_target
    description: "goals scored by home team"
    inputs: [FTHG]
    dtype: int

  t_away_goals:
    table: match_target
    description: "goals scored by away team"
    inputs: [FTAG]
    dtype: int

  t_result:
    table: match_target
    description: "full-time result H/D/A"
    inputs: [FTR]
    dtype: string

  t_home_flg:
    table: match_target
    description: "home win flag"
    inputs: [FTR]
    dtype: bool

  t_draw_flg:
    table: match_target
    description: "draw flag"
    inputs: [FTR]
    dtype: bool

  t_away_flg:
    table: match_target
    description: "away win flag"
    inputs: [FTR]
    dtype: bool

  t_flg_diff:
    table: match_target
    description: "signed match result: 1 home win, 0 draw, -1 away win (= t_home_flg - t_away_flg). Same scale as teams_elo_diff_crr_impl_diff / teams_elo_diff_lrr_impl_diff, whose fits target it"
    inputs: [FTR]
    dtype: int

  t_goals_diff:
    table: match_target
    description: "home_goals - away_goals"
    inputs: [FTHG, FTAG]
    dtype: int

  t_goals_total:
    table: match_target
    description: "home_goals + away_goals"
    inputs: [FTHG, FTAG]
    dtype: int

  t_home_profit:
    table: match_target
    description: "profit from betting on home win: 1 - mrkt_home_impl if home wins, else -mrkt_home_impl"
    inputs: [FTR, AvgH]
    dtype: float

  t_draw_profit:
    table: match_target
    description: "profit from betting on draw: 1 - mrkt_draw_impl if draw, else -mrkt_draw_impl"
    inputs: [FTR, AvgD]
    dtype: float

  t_away_profit:
    table: match_target
    description: "profit from betting on away win: 1 - mrkt_away_impl if away wins, else -mrkt_away_impl"
    inputs: [FTR, AvgA]
    dtype: float
