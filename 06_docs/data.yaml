schema_version: 1
float_precision: 3

ids:

  match_id:
    description: "match identifier"
    built_from: [league, season, hmt_name, awt_name]
    rule: "md5(league|season|hmt_name|awt_name)"
    dtype: string

tables:

  match_info:
    id: match_id
    source: [raw/matches, raw/attributes]

  match_target:
    id: match_id
    source: raw/matches

  team_stats:
    id: match_id
    source: [raw/matches, raw/xg]
    note: "one row per match; team statistics as home_/away_ dimensioned
           features. all stats computed from matches strictly BEFORE the
           match date (current match excluded). first matches carry NaN stats.
           xg metrics are sourced from Understat and exist only where Understat
           covers the league (major group); NaN elsewhere."

  match_matchup_stats:
    id: match_id
    source: features/team_stats
    note: "one row per match; comparative features derived from team_stats
           home_/away_ columns. windowing follows team_stats."

  match_team_fatigue:
    id: match_id
    source: [raw/matches, raw/domestic, raw/europe, raw/intl]
    note: "one row per match; schedule-density features for both teams, computed on each
           team's full fixture calendar: domestic league, domestic cups, european cups and
           super / intercontinental cups. non-league fixtures enter the calendar as history
           only and are never rows of this table. every backward window excludes the current
           match and is truncated at the season start."

columns:

  league:
    table: match_info
    description: "league (england, spain, italy, germany, france)"
    dtype: string

  season:
    table: match_info
    description: "season, e.g. '2223'"
    dtype: string

  hmt_name:
    table: match_info
    description: "home team"
    inputs: [HomeTeam]
    dtype: string

  awt_name:
    table: match_info
    description: "away team"
    inputs: [AwayTeam]
    dtype: string

  date:
    table: match_info
    description: "match date"
    inputs: [Date]
    dtype: date

  time:
    table: match_info
    description: "kick-off time"
    inputs: [Time]
    dtype: string

  time_uk_num:
    table: match_info
    description: "kick-off time (UK) as a number: hour + minute/60 (e.g. 19:45 -> 19.75)"
    inputs: [Time]
    dtype: float
    range: [11, 23]

  time_uk_cat:
    table: match_info
    description: "kick-off time (UK) bucketed by floor(hour): early (11-13), early_afternoon (14-15), late_afternoon (16-17), evening (18+)"
    inputs: [Time]
    dtype: string
    categories: [early, early_afternoon, late_afternoon, evening]

  day_of_week:
    table: match_info
    description: "day of week of the match"
    inputs: [Date]
    dtype: string

  day_of_week_cat:
    table: match_info
    description: "day_of_week grouped: weekend (sat/sun), shoulder (fri/mon), midweek (tue/wed/thu)"
    dtype: string
    categories: [weekend, shoulder, midweek]

  season_game_number:
    table: match_info
    description: "sequential match number in the league-season (1 = first match of the season)"
    dtype: int
    range: [1, 552]

  season_game_number_before_end:
    table: match_info
    description: "season_game_number counted backwards to the end of the season, the same way season_game_number_before_break counts back to the next break: -1 = last match of the season, down to -N for the first (N = full-season match count = n_teams*(n_teams-1)); a skipped match leaves the last match at -2 (e.g. france 2526, 305/306)"
    dtype: int
    range: [-552, -1]

  gameweek:
    table: match_info
    description: "gameweek number; derived as ceil(season_game_number / (n_teams/2)) where n_teams is counted per league-season"
    dtype: int
    range: [1, 46]

  gameweek_before_end:
    table: match_info
    description: "gameweek counted backwards to the end of the season: -1 = last gameweek, down to -G for the first (G = full-season gameweek count = 2*(n_teams-1))"
    dtype: int
    range: [-46, -1]

  season_4phase:
    table: match_info
    description: "season phase (4 levels) based on international breaks; boundaries from 01_data/01_raw/03_dates/season_limit_dates.csv"
    dtype: string
    categories: [summer, fall, winter, spring]

  season_3phase:
    table: match_info
    description: "season phase (3 levels): start=summer, mid=fall+winter, end=spring"
    dtype: string
    categories: [start, mid, end]

  season_game_number_after_break:
    table: match_info
    description: "the league-season's matches counted from the last break in which every league of the group stopped: 1 = the first match the league played after it. The league-season counterpart of {side}_game_number_after_break, in the same relation as season_game_number to {side}_game_number. Unlike gameweek it does not give a whole round one value, so the friday match of a restart round is 1 and the monday one is 10. Empty before the season's first break"
    dtype: int

  season_game_number_before_break:
    table: match_info
    description: "the same league-season count taken backwards to the next break: -1 = the last match the league played before it. Empty after the season's last break"
    dtype: int

  gameweek_after_break:
    table: match_info
    description: "season_game_number_after_break bucketed into rounds the same way gameweek buckets season_game_number: ceil over half the team count. 1 = the league's first round back after the break. As with gameweek a bucket is not guaranteed to be a real round, because rescheduling moves matches between them. Empty before the season's first break"
    dtype: int

  gameweek_before_break:
    table: match_info
    description: "the same bucketing taken backwards to the next break: -1 = the league's last round before it. Empty after the season's last break"
    dtype: int

  "{side}_game_number_after_break":
    table: match_info
    description: "the {side} team's league matches counted from the last break in which every league of the group stopped: 1 = the first match after it. Break windows are hand-recorded in 01_data/01_raw/03_dates/break_dates.csv. Counted per team, not per gameweek, because a rescheduled fixture can leave two teams in one gameweek with different counts. Empty before the season's first break. A league-specific pause (the winter break, which england plays through) is not a break here, and neither is the gap between seasons"
    dims:
      side: [hmt, awt]
    dtype: int

  "{side}_game_number_before_break":
    table: match_info
    description: "the same count taken backwards to the next break: -1 = the {side} team's last league match before it, -2 the one before that. Empty after the season's last break"
    dims:
      side: [hmt, awt]
    dtype: int

  hmt_is_promoted:
    table: match_info
    description: "home team promoted to the league this season"
    inputs: [Promotee]
    dtype: bool

  awt_is_promoted:
    table: match_info
    description: "away team promoted to the league this season"
    inputs: [Promotee]
    dtype: bool

  hmt_is_top3_last:
    table: match_info
    groups: [major, other]
    description: "home team finished top 3 in this league last season (reigning top-3, analogous to promoted for the previous season's best). Top-tier groups only. Seeded from external final tables for the earliest season; agrees with team_season_final rankings for all later seasons"
    inputs: [Top3Last]
    dtype: bool

  awt_is_top3_last:
    table: match_info
    groups: [major, other]
    description: "away team finished top 3 in this league last season (reigning top-3, analogous to promoted for the previous season's best). Top-tier groups only. Seeded from external final tables for the earliest season; agrees with team_season_final rankings for all later seasons"
    inputs: [Top3Last]
    dtype: bool

  hmt_is_relegated:
    table: match_info
    groups: [minor]
    description: "home team was relegated from the tier above into this league this season (minor group only; the second-tier analogue of is_top3_last)"
    inputs: [Relegated]
    dtype: bool

  awt_is_relegated:
    table: match_info
    groups: [minor]
    description: "away team was relegated from the tier above into this league this season (minor group only; the second-tier analogue of is_top3_last)"
    inputs: [Relegated]
    dtype: bool

  hmt_is_island:
    table: match_info
    description: "home team is on a geographically isolated island (Canaries/Balearics/Sardinia/Corsica): Las Palmas, Mallorca, Cagliari, Ajaccio"
    inputs: [Island]
    dtype: bool

  awt_is_island:
    table: match_info
    description: "away team is on a geographically isolated island (Canaries/Balearics/Sardinia/Corsica): Las Palmas, Mallorca, Cagliari, Ajaccio"
    inputs: [Island]
    dtype: bool

  travel_distance_km:
    table: match_info
    description: "haversine distance between home and away team stadiums"
    inputs: [Latitude, Longitude]
    dtype: float
    range: [0, 4000]

  travel_distance_cat:
    table: match_info
    description: "travel_distance_km bucketed: derby (<30, city rivalries), regional (30-100, neighbouring cities same region), domestic (100-500, coach / high-speed rail incl. Barcelona-Real 499km AVE), long_haul (500+, flight territory)"
    inputs: [Latitude, Longitude]
    dtype: string
    categories: [derby, regional, domestic, long_haul]

  "{side}_elo":
    table: match_info
    description: "Club Elo rating of the {side} team as of the match date (pre-match, From <= date <= To; from clubelo.com via 04_elo/team_map.csv; NaN if the team is unmapped or has no rating for that date)"
    dims:
      side: [hmt, awt]
    dtype: float
    range: [1000, 2200]

  "{side}_elo_cat2m":
    table: match_info
    description: "high if {side}_elo > global elo mean (thresholds.json elo_mean), else low; None if elo is NaN"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_elo_cat3q":
    table: match_info
    description: "tertile of {side}_elo from the pooled per-match elo distribution (thresholds.json elo_p33/p67); None if elo is NaN"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{bookmaker}_{outcome}_odds":
    table: match_info
    description: "odds from {bookmaker} for outcome {outcome}. b365/mrkt are the pre-closing line (football-data non-C columns); b365c/mrktc are the closing (kickoff) line (football-data C columns) — same bookmaker/market with a trailing c. Empty where football-data has no closing price"
    dims:
      bookmaker: [b365, mrkt, b365c, mrktc]
      outcome: [home, draw, away]
    dtype: float
    range: [1.01, 100]

  "{bookmaker}_{outcome}_impl":
    table: match_info
    description: "implied probability of {outcome} from {bookmaker} odds (1/odds)"
    dims:
      bookmaker: [b365, mrkt, b365c, mrktc]
      outcome: [home, draw, away]
    dtype: float
    range: [0, 1]

  "{bookmaker}_margin":
    table: match_info
    description: "{bookmaker} overround on HDA market (sum of implied - 1)"
    dims:
      bookmaker: [b365, mrkt, b365c, mrktc]
    dtype: float
    range: [0, 0.2]

  "{bookmaker}_entropy":
    table: match_info
    description: "shannon entropy of normalized {bookmaker} implied probabilities (H/D/A); max = log2(3) ~ 1.585"
    dims:
      bookmaker: [b365, mrkt, b365c, mrktc]
    dtype: float
    range: [0, 1.585]

  mrkt_favourite:
    table: match_info
    description: "team with mrkt normalized implied probability > 50% (home/away/balanced)"
    dtype: string
    categories: [home, away, balanced]

  mrkt_impl_order:
    table: match_info
    description: "ordering of H/D/A outcomes by mrkt implied probability descending (e.g. hda = home > draw > away)"
    dtype: string
    categories: [hda, had, dha, dah, ahd, adh]

  mrkt_favrt_impl:
    table: match_info
    description: "mrkt implied probability of the stronger side: max(home_impl, away_impl)"
    dtype: float
    range: [0, 1]

  mrkt_undrd_impl:
    table: match_info
    description: "mrkt implied probability of the weaker side: min(home_impl, away_impl)"
    dtype: float
    range: [0, 1]

  "{bookmaker}_home_away_impl_diff":
    table: match_info
    description: "{bookmaker} home implied probability minus away implied probability; positive = home favoured. b365/mrkt pre-closing, b365c/mrktc closing"
    dims:
      bookmaker: [b365, mrkt, b365c, mrktc]
    dtype: float
    range: [-1, 1]

  "{side}_game_number":
    table: team_stats
    description: "sequential match number for the {side} team in the season (1 = first match)"
    dims:
      side: [hmt, awt]
    dtype: int
    range: [1, 46]

  "{side}_{window}_{metric}_{kind}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} {kind} per match over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      metric: [goals, shots, shots_on_target, corners, yellow, xg]
      kind: [for, agst]
    dtype: float

  "hmt_home_{window}_{metric}_{kind}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} {kind} per home match over {window}, home team only"
    dims:
      window: [season]
      metric: [goals, shots, shots_on_target]
      kind: [for, agst]
    dtype: float

  "awt_away_{window}_{metric}_{kind}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} {kind} per away match over {window}, away team only"
    dims:
      window: [season]
      metric: [goals, shots, shots_on_target]
      kind: [for, agst]
    dtype: float

  "hmt_home_{window}_{metric}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} per home match over {window}, home team only"
    dims:
      window: [season]
      metric: [points, flg_diff, goals_diff, goals_total]
    dtype: float

  "awt_away_{window}_{metric}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} per away match over {window}, away team only"
    dims:
      window: [season]
      metric: [points, flg_diff, goals_diff, goals_total]
    dtype: float

  "hmt_home_{window}_{result}_ratio":
    table: team_stats
    description: "share of home matches with {result} over {window}, home team only"
    dims:
      window: [season]
      result: [wins, draws, losses]
    dtype: float
    range: [0, 1]

  "awt_away_{window}_{result}_ratio":
    table: team_stats
    description: "share of away matches with {result} over {window}, away team only"
    dims:
      window: [season]
      result: [wins, draws, losses]
    dtype: float
    range: [0, 1]

  "hmt_home_{window}_{line}_impl_points_avg":
    table: team_stats
    description: "market-expected points per home match over {window}, home team only, on the {line} line (mp pre-closing / mc closing): {line}_impl_win_avg * 3 + {line}_impl_draw_avg"
    dims:
      window: [season]
      line: [mp, mc]
    dtype: float
    range: [0, 3]

  "awt_away_{window}_{line}_impl_points_avg":
    table: team_stats
    description: "market-expected points per away match over {window}, away team only, on the {line} line (mp pre-closing / mc closing): {line}_impl_win_avg * 3 + {line}_impl_draw_avg"
    dims:
      window: [season]
      line: [mp, mc]
    dtype: float
    range: [0, 3]

  "hmt_home_{window}_{line}_impl_diff_avg":
    table: team_stats
    description: "market-implied margin per home match over {window}, home team only, on the {line} line (mp pre-closing / mc closing): mean of mrkt_home_away_impl_diff (= impl_win - impl_loss) over home matches; positive = market favours this team at home"
    dims:
      window: [season]
      line: [mp, mc]
    dtype: float
    range: [-1, 1]

  "awt_away_{window}_{line}_impl_diff_avg":
    table: team_stats
    description: "market-implied margin per away match over {window}, away team only, on the {line} line (mp pre-closing / mc closing): mean of the team-oriented margin (impl_win - impl_loss, = -mrkt_home_away_impl_diff) over away matches; positive = market favours this team away"
    dims:
      window: [season]
      line: [mp, mc]
    dtype: float
    range: [-1, 1]

  "hmt_home_{window}_{metric}_avg_adv":
    table: team_stats
    description: "home-venue advantage of home team: home {metric} avg minus away {metric} avg over {window} (positive = better at home)"
    dims:
      window: [season]
      metric: [points, mp_impl_points, mc_impl_points, flg_diff, mp_impl_diff, mc_impl_diff]
    dtype: float
    range: [-3, 3]

  "awt_away_{window}_{metric}_avg_adv":
    table: team_stats
    description: "away-venue advantage of away team: away {metric} avg minus home {metric} avg over {window} (usually negative = disadvantage)"
    dims:
      window: [season]
      metric: [points, mp_impl_points, mc_impl_points, flg_diff, mp_impl_diff, mc_impl_diff]
    dtype: float
    range: [-3, 3]

  "{side}_{window}_{metric}_avg":
    table: team_stats
    description: "arithmetic mean of {metric} per match over {window}, {side} team. flg_diff is the per-match signed result win_flg - loss_flg (+1/0/-1, same axis as t_flg_diff); its mean equals wins_ratio - losses_ratio and is the realized counterpart of {line}_impl_diff_avg"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      metric: [points, flg_diff, goals_diff, goals_total, shots_on_target_diff, shots_on_target_total, xg_diff, xg_total]
    dtype: float

  "{side}_{window}_{metric}_std":
    table: team_stats
    description: "standard deviation of {metric} per match over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      metric: [goals_diff, goals_total, shots_on_target_diff, shots_on_target_total, xg_diff, xg_total]
    dtype: float

  "{side}_{window}_{result}_ratio":
    table: team_stats
    description: "share of matches with {result} over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      result: [wins, draws, losses]
    dtype: float
    range: [0, 1]

  "{side}_{window}_goals_total_le{x}_ratio":
    table: team_stats
    description: "share of matches with total goals <= {x} over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      x: [0, 1, 2, 3, 4]
    dtype: float
    range: [0, 1]

  "{side}_{window}_goals_{kind}_le{x}_ratio":
    table: team_stats
    description: "share of matches with goals {kind} <= {x} over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      kind: [for, agst]
      x: [0, 1, 2]
    dtype: float
    range: [0, 1]

  "{side}_{window}_shots_on_target_{kind}_ratio":
    table: team_stats
    description: "cumulative shots on target / cumulative shots ({kind}) over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      kind: [for, agst]
    dtype: float
    range: [0, 1]

  "{side}_{window}_red_for_avg":
    table: team_stats
    description: "average red cards received per match over {window}, {side} team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
    dtype: float

  "{side}_red_last_match":
    table: team_stats
    description: "{side} team received a red card in its previous match (NaN if no previous match)"
    dims:
      side: [hmt, awt]
    dtype: bool

  "{side}_{window}_{line}_impl_{outcome}_avg":
    table: team_stats
    description: "market implied probability of {outcome} for {side} team over {window}, on the {line} line (mp = market pre-closing, mc = market closing; mc empty where no closing price)"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      line: [mp, mc]
      outcome: [win, draw, loss]
    dtype: float
    range: [0, 1]

  "{side}_{window}_{line}_impl_points_avg":
    table: team_stats
    description: "market-expected points per match over {window} on the {line} line (mp pre-closing / mc closing): {line}_impl_win_avg * 3 + {line}_impl_draw_avg"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      line: [mp, mc]
    dtype: float
    range: [0, 3]

  "{side}_{window}_{line}_impl_diff_avg":
    table: team_stats
    description: "market-implied margin per match over {window} on the {line} line (mp pre-closing / mc closing): {line}_impl_win_avg - {line}_impl_loss_avg. Team-oriented mrkt_home_away_impl_diff (home +, away -; draw cancels, no devig); positive = market favours this team"
    dims:
      side: [hmt, awt]
      window: [season, rolling6, rolling8]
      line: [mp, mc]
    dtype: float
    range: [-1, 1]

  "{side}_season_goals_total_cat2m":
    table: team_stats
    description: "high if season_goals_total_avg > global mean (thresholds.json goals_total_mean), else low"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_season_goals_diff_cat2m":
    table: team_stats
    description: "positive if season_goals_diff_avg > 0, else negative"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [positive, negative]

  "{side}_season_goals_for_cat2m":
    table: team_stats
    description: "high if season_goals_for_avg > global mean (thresholds.json goals_for_mean), else low"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_season_goals_agst_cat2m":
    table: team_stats
    description: "high if season_goals_agst_avg > global mean (thresholds.json goals_agst_mean), else low"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_season_goals_total_cat3q":
    table: team_stats
    description: "tertile of season_goals_total_avg from team_season_final (thresholds.json goals_total_p33/p67)"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{side}_season_goals_diff_cat3q":
    table: team_stats
    description: "tertile of season_goals_diff_avg from team_season_final (thresholds.json goals_diff_p33/p67)"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{side}_season_goals_for_cat3q":
    table: team_stats
    description: "tertile of season_goals_for_avg from team_season_final (thresholds.json goals_for_p33/p67)"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{side}_season_goals_agst_cat3q":
    table: team_stats
    description: "tertile of season_goals_agst_avg from team_season_final (thresholds.json goals_agst_p33/p67)"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{side}_season_shots_on_target_for_cat2m":
    table: team_stats
    description: "high if season_shots_on_target_for_avg > global mean (thresholds.json shots_on_target_foragst_mean), else low"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_season_shots_on_target_agst_cat2m":
    table: team_stats
    description: "high if season_shots_on_target_agst_avg > global mean (thresholds.json shots_on_target_foragst_mean), else low"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [high, low]

  "{side}_season_shots_on_target_for_cat3q":
    table: team_stats
    description: "tertile of season_shots_on_target_for_avg from team_season_final (thresholds.json shots_on_target_foragst_p33/p67)"
    dims:
      side: [hmt, awt]
    dtype: string
    categories: [low, medium, high]

  "{side}_season_shots_on_target_agst_cat3q":
